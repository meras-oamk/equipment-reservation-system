<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reservations</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="/css/admin_shared.css" />
  <link rel="stylesheet" href="/css/admin_reservations_list.css" />
</head>
<body>

<!-- REUSEABLE NAVBAR -->
<div id="sidebar-container"></div>

<main class="main">
  <h4 class="fw-bold mb-4">Reservations</h4>

  <!-- Stats -->
  <div class="row g-3 mb-4">
    
    <!-- Reservation Outcomes  -->
    <div class="col-md-4">
      <div class="stat-card">
        <h5 class="card-title">Reservation Outcomes</h5>
        <div class="chart-container radial-wrapper">
          <canvas id="outcomesDoughnutChart"></canvas>
          <div class="doughnut-center-text">
            <div class="doughnut-total" id="outcomesTotal">-</div>
            <div class="doughnut-label">Total</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Expected Inspection Workload -->
    <div class="col-md-4">
      <div class="stat-card">
        <h5 class="card-title">Expected Inspection Workload</h5>
        <div class="chart-container">
          <canvas id="weeklyLoadChart"></canvas>
        </div>
      </div>
    </div>
    
    <!-- Borrowing Duration by Category -->
    <div class="col-md-4">
      <div class="stat-card">
        <h5 class="card-title">Avg. Borrow Duration (Hours)</h5>
        <div class="chart-container">
          <canvas id="durationBarChart"></canvas>
        </div>
      </div>
    </div>

  </div>

  <!-- Search + Filter -->
  <div class="d-flex gap-3 mb-4">
    <div class="position-relative flex-grow-1">
      <i class="bi bi-search position-absolute" style="left:14px;top:50%;transform:translateY(-50%);color:#aaa"></i>
      <input class="search-bar ps-5" placeholder="Search by user name or equipment name..." />
    </div>

    <select class="form-select filter-select px-3 py-2" style="font-weight: 600; cursor: pointer; width: auto; min-width: 180px;">
      <option value="all" data-type="filter">All</option>
      <option value="approved" data-type="filter">Approved</option>
      <option value="active" data-type="filter">Active</option>
      <option value="pending_return" data-type="filter">Pending Return</option>
      <option value="overdue" data-type="filter">Overdue</option>
      <option value="completed" data-type="filter">Completed</option>
      <option value="cancelled" data-type="filter">Cancelled</option>
    </select>
  </div>

  <!-- Table -->
  <div class="table-wrap">
  </div>
</main>

<script src="/js/admin/navbar.js"></script>
<script src="/js/admin/search_sort.js"></script>
<script src="/js/admin/reservations_list.js"></script>
<script src="/js/admin/graphs.js"></script>

</body>
</html>
