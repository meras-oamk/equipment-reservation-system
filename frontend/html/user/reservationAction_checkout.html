<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Return</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="../../css/reservationAction_checkout.css">
  </head>
<body>
<div class="page-wrapper">

  <!-- NAVBAR -->
  <nav class="top-navbar">
    <img src="../../Assets/Logo.png" alt="Logo" class="logo">
    <button class="nav-toggle" id="navToggle"><i class="bi bi-list"></i></button>
    <div class="nav-links" id="navLinks">
      <a href="equipments_list.html">Equipments</a>
      <a href="myReservation.html" class="active">Reservations</a>
      <a href="myAccount.html">My Account</a>
      <a href="#" class="logout" id="logoutBtn">Logout</a>
    </div>
  </nav>

  <!-- CONTENT -->
  <div class="content">
    <a href="reservationDetails.html" id="backLink" class="back-link">
  <i class="bi bi-arrow-left"></i> Back
</a>

<h1 class="page-title">Return</h1>

<div class="action-card">
  <div class="equipment-name" id="checkout-device">—</div>

  <div class="detail-rows">
    <div class="detail-row">
      <div class="row-icon"><i class="bi bi-calendar3"></i></div>
      <div>
        <div class="row-label">Reservation Start</div>
        <div class="row-value" id="checkout-start">—</div>
      </div>
    </div>
    <div class="detail-row">
      <div class="row-icon"><i class="bi bi-calendar3"></i></div>
      <div>
        <div class="row-label">Reservation End</div>
        <div class="row-value" id="checkout-end">—</div>
      </div>
    </div>
    <div class="detail-row">
      <div class="row-icon"><i class="bi bi-geo-alt"></i></div>
      <div>
        <div class="row-label">Pickup Location</div>
        <div class="row-value" id="checkout-location">—</div>
      </div>
    </div>
  </div>

  <p class="admin-note">Admin will check the equipment's conditional before the status becomes officially returned!</p>

  <button class="btn-scan-qr" onclick="window.location.href='scanQrCode.html'">
    <i class="bi bi-qr-code-scan"></i> Scan QR Code
  </button>
</div>
  </div>

</div><!-- /page-wrapper -->

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../js/user/reservationAction_checkout.js"></script>
  <script>
  const logoutBtn = document.getElementById('logoutBtn');
  const token = localStorage.getItem('token');

  if (!token) window.location.href = '../../index.html';

  logoutBtn.addEventListener('click', (e) => {
    e.preventDefault();
    localStorage.removeItem('token');
    localStorage.removeItem('role');
    window.location.href = '../../index.html';
  });

  document.getElementById('navToggle').addEventListener('click', () => {
    document.getElementById('navLinks').classList.toggle('open');
  });
  </script>
</body>
</html>
