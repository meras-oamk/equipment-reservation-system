<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Reservations</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="../../css/navbar.css">
  <link rel="stylesheet" href="../../css/myReservation.css">
  </head>
<body>
<div class="page-wrapper">

  <!-- REUSEABLE NAVBAR -->
    <div id="static-container"></div> 

  <!-- CONTENT -->
  <div class="content">
    <h1 class="page-title">My Reservations</h1>

    <div class="reservations-card">
      
      <!-- TABS -->
      <div class="tab-bar">
        <button class="tab-btn active" data-tab="inactive">Inactive</button>
        <button class="tab-btn" data-tab="active">Active</button>
        <button class="tab-btn" data-tab="overdue">Overdue</button>
        <button class="tab-btn" data-tab="completed">Completed</button>
      </div>


      <!-- DESKTOP TABLE -->
      <div class="desktop-table">
        <table class="res-table">
          <thead>
            <tr>
              <th>Device</th>
              <th>Reservation Id</th>
              <th>Pickup Date</th>
              <th>Return Date</th>
              <th>Duration</th>
              <th>Quantity</th>
              <th>Location</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>

      <!-- MOBILE LIST -->
      <div class="mobile-res-list" id="mobileList"></div>
    </div>
  </div>

</div><!-- /page-wrapper -->

  <script src="../../js/user/navbar.js"></script>
  <script src="../../js/user/myReservation.js" type="module"></script>
  </body>
</html>
