<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Reservations</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="../../css/myReservation.css">
  </head>
<body>
<div class="page-wrapper">

  <!-- NAVBAR -->
  <nav class="top-navbar">
    <img src="../../Assets/Logo.png" alt="Logo" class="logo">
    <button class="nav-toggle" id="navToggle"><i class="bi bi-list"></i></button>
    <div class="nav-links" id="navLinks">
      <a href="equipments_list.html">Equipments</a>
      <a href="myReservation.html" class="active">Reservations</a>
      <a href="myAccount.html">My Account</a>
      <a href="../../index.html" class="logout" id="logoutBtn">Logout</a>
    </div>
  </nav>

  <!-- CONTENT -->
  <div class="content">
    <h1 class="page-title">My Reservations</h1>

    <div class="reservations-card">
      
      <!-- TABS -->
      <div class="tab-bar">
        <button class="tab-btn active" data-tab="inactive">Inactive</button>
        <button class="tab-btn" data-tab="active">Active</button>
        <button class="tab-btn" data-tab="overdue">Overdue</button>
        <button class="tab-btn" data-tab="completed">Completed</button>
      </div>


      <!-- DESKTOP TABLE -->
      <div class="desktop-table">
        <table class="res-table">
          <thead>
            <tr>
              <th>Device</th>
              <th>Reservation Id</th>
              <th>Start / End </th>
              <th>Actual Pickup / Return</th>
              <th>Duration</th>
              <th>Quantity</th>
              <th>Location</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>

      <!-- MOBILE LIST -->
      <div class="mobile-res-list" id="mobileList"></div>
    </div>
  </div>

</div><!-- /page-wrapper -->

  <script src="../../js/user/myReservation.js" type="module"></script>
  <script>
  const token = localStorage.getItem('token');
  if (!token) window.location.href = '../../index.html';

  document.getElementById('logoutBtn').addEventListener('click', (e) => {
    e.preventDefault();
    localStorage.removeItem('token');
    localStorage.removeItem('role');
    window.location.href = '../../index.html';
  });

  document.getElementById('navToggle').addEventListener('click', () => {
    document.getElementById('navLinks').classList.toggle('open');
  });
  </script>
  </body>
</html>
