<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Scanning QR Code</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="../../css/navbar.css">
  <link rel="stylesheet" href="../../css/scanQrCode.css">
  <script src="../../js/user/navbar.js"></script>
  </head>
<body>
<div class="page-wrapper">

  <!-- REUSEABLE NAVBAR -->
    <div id="static-container"></div>

  <!-- CONTENT -->
  <div class="content">
    <h1 class="page-title">Scanning QR Code</h1>

    <div class="scan-card">
      <div class="scan-card-title">Scan QR Code</div>

      <!-- QR Viewfinder -->
      <div id="reader" style="width:100%;"></div>

      <p class="qr-hint">Position the QR code within the frame</p>

      <!-- OR divider -->
      <div class="or-divider">OR</div>

      <!-- Close -->
      <button class="btn-close-page" onclick="history.back()">Close</button>
    </div>
  </div>

</div><!-- /page-wrapper -->

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8"></script>
  <script src="../../js/user/scanQrCode.js"></script>
 
</body>
</html>
