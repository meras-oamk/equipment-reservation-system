<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="/css/admin_shared.css" />
  <link rel="stylesheet" href="/css/admin_dashboard.css" />
</head>
<body>

<!-- REUSEABLE NAVBAR -->
<div id="sidebar-container"></div>

<!-- ── MAIN ── -->
<main class="main">
  <h4 class="fw-bold mb-4">Dashboard</h4>

  <div class="row g-3 mb-4">
    <!-- Stat: Most Used -->
    <div class="col-md-4">

      <div class="stat-card">
        <h5 class="card-title">Inventory Utilization</h5>
        <div class="grade-card-body">
          <div class="radial-container">
            <svg class="radial-svg" viewBox="0 0 100 100">
              <circle class="radial-track" cx="50" cy="50" r="40" />
              <circle class="radial-progress" id="utilizationProgressCircle" cx="50" cy="50" r="40" style="stroke-dasharray: 251.2; stroke-dashoffset: 251.2;" />
            </svg>
            <div class="radial-text">
              <div class="grade-percent" id="utilizationPercent">-%</div>
            </div>
          </div>
          <p class="grade-subtext utilizationSubtext">Loading utilization metrics...</p>
        </div>
      </div>
    </div>

    <!-- Stat: Return Requests -->
    <div class="col-md-4">
      <div class="stat-card">
        <h5 class="card-title">Peak Demand Trends (Last 8 weeks)</h5>
        <div class="chart-container">
          <canvas id="demandLineChart"></canvas>
        </div>
      </div>
    </div>
    
    <!-- Stat: Overdue -->
    <div class="col-md-4">
      <div class="stat-card">
        <h5 class="card-title">Category Popularity</h5>
        <div class="chart-container">
          <canvas id="popularityBarChart"></canvas>
        </div>
      </div>
    </div>
  </div>


  <!-- ── BOTTOM PANELS ── -->
  <div class="row g-3">
    <!-- Return Requests List -->
    <div class="col-md-5">
      <div id="leftPanel" class="panel">
        <div class="panel-title">Return Requests</div>

      </div>
    </div>

    <!-- Request Detail -->
    <div class="col-md-7">
      <div id="rightPanel" class="panel">
        <div class="panel-title">Requests Details</div>
        
        <div id="rightPanelPlaceholder" class="eq-meta" style="padding: 40px 15px; text-align: center; color: #888; display: none;">
          Select a request
        </div>
        
        <div id="rightPanelDetails" style="display: none;">
          <div class="detail-title" id="detailName"></div>
  
          <div class="detail-row">
            <span class="label">Request ID:</span>
            <span class="value" id="detailId"></span>
          </div>
          <div class="detail-row">
            <span class="label">Unit:</span>
            <span class="value" id="detailUnit"></span>
          </div>
          <div class="detail-row">
            <span class="label">User:</span>
            <span class="value" id="detailUser"></span>
          </div>
          <div class="detail-row">
            <span class="label">Email:</span>
            <span class="value" id="detailEmail"></span>
          </div>
          <div class="detail-row">
            <span class="label">Start Date:</span>
            <span class="value" id="detailStart"></span>
          </div>
          <div class="detail-row">
            <span class="label">End Date:</span>
            <span class="value" id="detailEnd"></span>
          </div>
          <div class="detail-row">
            <span class="label">Location:</span>
            <span class="value" id="detailLocation"></span>
          </div>
          <div class="detail-row mb-3">
            <span class="label">Return At:</span>
            <span class="value" id="detailReturn"></span>
          </div>
  
          <div class="mb-3">
            <label class="form-label fw-semibold" style="font-size:14px">Equipment's Condition:</label>
            <select class="condition-select">
            </select>
          </div>
  
          <div class="mb-2">
            <label class="form-label fw-semibold" style="font-size:14px">Inspection Note (Optional)</label>
            <textarea class="inspection-note" placeholder="e.g. minor scratch on left side..."></textarea>
          </div>
  
          <button class="confirm-btn">Confirm Return</button>
        </div>
      </div>
    </div>
  </div>
</main>

<script src="/js/admin/navbar.js"></script>
<script src="/js/admin/detailsController.js"></script>
<script src="/js/admin/dashboard.js"></script>
<script src="/js/admin/graphs.js"></script>

</body>
</html>
