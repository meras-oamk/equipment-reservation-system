<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Users</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/css/admin_shared.css" />
  <link rel="stylesheet" href="/css/admin_manageUsers.css" />
</head>
<body>

<!-- REUSEABLE NAVBAR -->
<div id="sidebar-container"></div>

<main class="main">
  <div class="page-header">
    <h4 class="fw-bold mb-0">Manage Users</h4>
    <button class="btn-add-admin" onclick="openAdminModal()">
      <i class="bi bi-plus-lg"></i> Add Admin
    </button>
  </div>

  <!-- Stats -->
  <div class="row g-3 mb-4">
    <div class="col"><div class="stat-card"><div class="stat-label">Total</div><div class="stat-value">9</div></div></div>
    <div class="col"><div class="stat-card"><div class="stat-label">Active</div><div class="stat-value">5</div></div></div>
    <div class="col"><div class="stat-card"><div class="stat-label">Flagged</div><div class="stat-value">3</div></div></div>
    <div class="col"><div class="stat-card"><div class="stat-label">Banned</div><div class="stat-value">1</div></div></div>
  </div>

  <!-- Search + Filter -->
  <div class="d-flex gap-3 mb-4">
    <div class="position-relative flex-grow-1">
      <i class="bi bi-search position-absolute" style="left:14px;top:50%;transform:translateY(-50%);color:#aaa"></i>
      <input class="search-bar ps-5" placeholder="Search by user name or equipment category..." />
    </div>

    <select class="form-select filter-select px-3 py-2" style="font-weight: 600; cursor: pointer; width: auto; min-width: 180px;">
      <option value="all" data-type="filter">All Users</option>
      
      <optgroup label="Filter by Status">
        <option value="active" data-type="filter">Active</option>
        <option value="suspended" data-type="filter">Suspended</option>
        <option value="banned" data-type="filter">Banned</option>
      </optgroup>
      
      <optgroup label="Sort By">
        <option value="newest" data-type="sort">Join Date (Newest first)</option>
        <option value="oldest" data-type="sort">Join Date (Oldest first)</option>
      </optgroup>
    </select>

  </div>

  <!-- Panels -->
  <div class="row g-3">
    <!-- Users List -->
    <div class="col-md-5">
      <div id="leftPanel" class="panel">
        <div class="panel-title">Users</div>
      
      </div>
    </div>

    <!-- User Detail -->
    <div class="col-md-7">
      <div id="rightPanel" class="panel">
        <div class="panel-title">Users Details</div>

        <div id="rightPanelPlaceholder" class="eq-meta" style="padding: 40px 15px; text-align: center; color: #888; display: none;">
          Select a user
        </div>

        <div id="rightPanelDetails" style="display: none;">

          <div style="display: flex; align-items: center;">
            <div class="detail-name" id="dName" style="margin: 0;"></div> 
            
            <span id="dStatusFlag" style="display: none; margin-left: 8px;" title="">
                <i class="bi bi-flag-fill"></i>
            </span>
          </div>

          <div class="detail-email" id="dEmail"></div>
          
          <div class="detail-meta">User ID: <span id="dId"></span></div>
          <div class="detail-meta">Join Date: <span id="dJoin"></span></div>
          <div class="detail-meta">Status: <span id="dStatus"></span></div>
          
          <div class="divider"></div>
          
          <div class="history-title">Reservation History</div>
          
          <div id="dHistoryContainer"></div>

          <div class="divider"></div>
          
          <div id="dUserActionsContainer" style="margin-top: 20px; display: flex; gap: 10px;"></div>
          
        </div>
      </div>
    </div>
  </div>
</main>

<!-- ADD ADMIN ACCOUNT MODAL -->
<div class="modal-overlay" id="addAdminModal">
  <div class="modal-box">
    <div class="modal-title">
      Add Admin
      <button type="button" class="btn-close ms-auto" onclick="closeAdminModal()"></button>
    </div>

    <form id="addAdmin" name="addAdminForm">
      <div class="modal-field">
        <label>Full name<span class="req">*</span></label>
        <input id="adminAddFullname" class="modal-input" type="text" placeholder="" />
      </div>
  
      <div class="modal-field">
        <label>Email<span class="req">*</span></label>
        <input id="adminAddEmail" class="modal-input" type="email" placeholder="" />
      </div>

      <div class="modal-field">
        <label>Password<span class="req">*</span></label>
        <input id="adminAddPassword" class="modal-input" type="password" placeholder=""></input>
      </div>
      
      <p id="addAdminError" class="error-text"></p>
      <div class="modal-footer">
        <button type="button" class="btn-modal-cancel" onclick="closeAdminModal()">Cancel</button>
        <button type="submit" class="btn-modal-save">Save</button>
      </div>
    </form>

  </div>
</div>  

<!-- ADD ADMIN SUCCESS MODAL -->
<div class="modal-overlay" id="addAdminSuccessModal">
  <div class="modal-box">
    <div class="modal-title">
      Admin Created!
      <button type="button" class="btn-close ms-auto" onclick="closeAdminSuccessModal()"></button>
    </div>

    <div class="modal-field">
      <p style="color: #2e7d32; background: #e8f5e9; padding: 10px; border-radius: 4px; font-size: 0.9rem; margin-bottom: 15px;">
        Please copy these credentials. You will not be able to see them again once closed.
      </p>
    </div>

    <div class="modal-field">
      <strong>Full Name:</strong> <span id="successFullName"></span>
    </div>
    
    <div class="modal-field">
      <strong>Email:</strong> <span id="successEmail"></span>
    </div>

    <div class="modal-field">
      <strong>Password:</strong> <span id="successPassword"></span>
    </div>
    
    <p id="copyFeedback" style="color: #2e7d32; font-size: 0.85rem; min-height: 1.25rem; margin-top: 10px; margin-bottom: 0;"></p>
    
    <div class="modal-footer" style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px;">
      <button type="button" class="btn-modal-cancel" onclick="closeAdminSuccessModal()">Close</button>
      <button type="button" class="btn-modal-save" onclick="copyCredentials()">Copy to Clipboard</button>
    </div>
  </div>
</div>

<script src="/js/admin/navbar.js"></script>
<script src="/js/admin/search_sort.js"></script>
<script src="/js/admin/detailsController.js"></script>
<script src="/js/admin/manageUsers.js"></script>

</body>
</html>
