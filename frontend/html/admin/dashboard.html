<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/css/admin_shared.css" />
  <link rel="stylesheet" href="/css/admin_dashboard.css" />
</head>
<body>

<!-- REUSEABLE NAVBAR -->
<div id="sidebar-container"></div>

<!-- ── MAIN ── -->
<main class="main">
  <h4 class="fw-bold mb-4">Dashboard</h4>

  <div class="row g-3 mb-4">
    <!-- Stat: Most Used -->
    <div class="col-md-4">
      <div class="stat-card">
        <div class="stat-label">Most Used</div>
        <div class="stat-sub">NewBeeDrone Replacement</div>
        <div class="stat-value">78%</div>
      </div>
    </div>

    <!-- Stat: Return Requests -->
    <div class="col-md-4">
      <div class="stat-card">
        <div class="stat-label">Return Requests</div>
        <div class="stat-value">12</div>
      </div>
    </div>
  </div>

  <!-- Stat: Overdue -->
  <div class="row g-3 mb-4">
    <div class="col-md-4">
      <div class="stat-card">
        <div class="stat-label">Overdue Returns</div>
        <div class="stat-value">3</div>
      </div>
    </div>
  </div>

  <!-- ── BOTTOM PANELS ── -->
  <div class="row g-3">
    <!-- Return Requests List -->
    <div class="col-md-5">
      <div id="leftPanel" class="panel">
        <div class="panel-title">Return Requests</div>

      </div>
    </div>

    <!-- Request Detail -->
    <div class="col-md-7">
      <div id="rightPanel" class="panel">
        <div class="panel-title">Requests Details</div>
        
        <div id="rightPanelPlaceholder" class="eq-meta" style="padding: 40px 15px; text-align: center; color: #888; display: none;">
          Select a request
        </div>
        
        <div id="rightPanelDetails" style="display: none;">
          <div class="detail-title" id="detailName"></div>
  
          <div class="detail-row">
            <span class="label">Request ID:</span>
            <span class="value" id="detailId"></span>
          </div>
          <div class="detail-row">
            <span class="label">Unit:</span>
            <span class="value" id="detailUnit"></span>
          </div>
          <div class="detail-row">
            <span class="label">User:</span>
            <span class="value" id="detailUser"></span>
          </div>
          <div class="detail-row">
            <span class="label">Email:</span>
            <span class="value" id="detailEmail"></span>
          </div>
          <div class="detail-row">
            <span class="label">Start Date:</span>
            <span class="value" id="detailStart"></span>
          </div>
          <div class="detail-row">
            <span class="label">End Date:</span>
            <span class="value" id="detailEnd"></span>
          </div>
          <div class="detail-row">
            <span class="label">Location:</span>
            <span class="value" id="detailLocation"></span>
          </div>
          <div class="detail-row mb-3">
            <span class="label">Return At:</span>
            <span class="value" id="detailReturn"></span>
          </div>
  
          <div class="mb-3">
            <label class="form-label fw-semibold" style="font-size:14px">Equipment's Condition:</label>
            <select class="condition-select">
            </select>
          </div>
  
          <div class="mb-2">
            <label class="form-label fw-semibold" style="font-size:14px">Inspection Note (Optional)</label>
            <textarea class="inspection-note" placeholder="e.g. minor scratch on left side..."></textarea>
          </div>
  
          <button class="confirm-btn">Confirm Return</button>
        </div>
      </div>
    </div>
  </div>
</main>

<script src="/js/admin/navbar.js"></script>
<script src="/js/admin/detailsController.js"></script>
<script src="/js/admin/dashboard.js"></script>

</body>
</html>
