<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equipment Reservation</title>
    <link rel="stylesheet" href="../css/landing-page-style.css">
</head>
<body>

<div class="container">
    <!-- Navbar -->
    <nav class="navbar">
        <img src="../assets/Logo.png" alt="Logo" class="logo">

        <div class="nav-buttons">
           <button class="btn" onclick="window.location.href='loginOrRegister.html?form=register'">Register</button>
            <button class="btn" onclick="window.location.href='loginOrRegister.html?form=login'">Login</button>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <h1>Reserve Equipment Easily</h1>
        <p>
            Browse, book, and manage equipment anytime, anywhere.
        </p>
    </section>

    <!-- Equipment Section -->
    <section class="equipment-section">
        <h2>All Equipment</h2>

        <div class="equipment-grid" id="equipmentGrid">

            <div class="card">
                <img>
                <div class="card-content">
                    <h3>NewBeeDrone Replacement</h3>
                    <span class="text-muted d-block mb-2">Drone</span>
                </div>
            </div>
        </div>
    </section>
</div>
<script>
const API_URL = "api/equipment/catalog";

async function loadEquipment() {
    try {
        const response = await fetch(API_URL);

        if (!response.ok) {
            throw new Error("Failed to load equipment");
        }

        const equipment = await response.json();

        const grid = document.getElementById("equipmentGrid");
        grid.innerHTML = "";

        equipment.forEach(item => {

            const image = item.image_url
                ? item.image_url
                : "../assets/Equipment1.png";

            const description = item.description
            ? item.description.replace(/^Details?:\s*/i, "")
            : "No description available.";

            grid.innerHTML += `
                <div class="card">
                    <img src="${image}" alt="${item.name}">

                    <div class="card-content">

                        <h3>${item.name}</h3>

                        <span class="text-muted d-block mb-2">
                            ${item.subcategory}
                        </span>

                        <p style="white-space: pre-line;">${description}</p>

                    </div>
                </div>
            `;
        });

    } catch (err) {
        console.error(err);

        document.getElementById("equipmentGrid").innerHTML =
            "<p>Unable to load equipment.</p>";
    }
}

loadEquipment();
</script>
</body>
</html>
