<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pickup</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="../../css/reservationAction_checkin.css">
  </head>
<body>

  <!-- NAV -->
  <nav class="navbar navbar-expand-md sticky-top px-3 px-md-4">
    <a class="navbar-brand" href="equipments_list.html">
      <div class="logo-icon"><img src="../../Assets/Logo.png" alt="Logo" width="60" height="60"/></div>
    </a>

    <button class="navbar-toggler ms-auto" type="button"
      data-bs-toggle="collapse" data-bs-target="#navMenu"
      aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
      <i class="bi bi-list fs-4"></i>
    </button>

    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto gap-md-2 mt-2 mt-md-0">
        <li class="nav-item"><a class="nav-link" href="equipments_list.html">Equipments</a></li>
        <li class="nav-item"><a class="nav-link" href="myReservation.html">Reservations</a></li>
        <li class="nav-item"><a class="nav-link" href="myAccount.html">My Account</a></li>
        <li class="nav-item"><a class="nav-link logout" id="logoutBtn" href="index.html">Logout</a></li>
      </ul>
    </div>
  </nav>

  <!-- PAGE -->
  <div class="container py-4" style="max-width: 600px;">
    <a href="reservationDetails.html" id="backLink" class="back-link">
      <i class="bi bi-arrow-left"></i> Back
    </a>

    <h1 class="page-title">Pickup</h1>

    <div class="action-card">
  <div class="equipment-name" id="checkin-device">—</div>

  <div class="detail-rows">
    <div class="detail-row">
      <div class="row-icon"><i class="bi bi-calendar3"></i></div>
      <div>
        <div class="row-label">Reservation Start</div>
        <div class="row-value" id="checkin-start">—</div>
      </div>
    </div>
    <div class="detail-row">
      <div class="row-icon"><i class="bi bi-calendar3"></i></div>
      <div>
        <div class="row-label">Reservation End</div>
        <div class="row-value" id="checkin-end">—</div>
      </div>
    </div>
    <div class="detail-row">
      <div class="row-icon"><i class="bi bi-geo-alt"></i></div>
      <div>
        <div class="row-label">Pickup Location</div>
        <div class="row-value" id="checkin-location">—</div>
      </div>
    </div>
  </div>

  <button class="btn-scan-qr" onclick="window.location.href='scanQrCode.html'">
    <i class="bi bi-qr-code-scan"></i> Scan QR Code
  </button>
</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../js/user/reservationAction_checkin.js"></script>
  <script>
  const logoutBtn = document.getElementById('logoutBtn');
  const token = localStorage.getItem('token');

  if (!token) window.location.href = '../../index.html';

  logoutBtn.addEventListener('click', (e) => {
    e.preventDefault(); // prevent the href from firing too
    localStorage.removeItem('token');
    localStorage.removeItem('role');
    window.location.href = '../../index.html';
  });
  </script>
</body>
</html>
