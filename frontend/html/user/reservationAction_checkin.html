<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pickup</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="../../css/navbar.css">
  <link rel="stylesheet" href="../../css/reservationAction_checkin.css">
  <script src="../../js/user/navbar.js"></script>  
</head>
<body>
<div class="page-wrapper">

  <!-- REUSEABLE NAVBAR -->
    <div id="static-container"></div>

  <!-- CONTENT -->
  <div class="content">
    <a href="reservationDetails.html" id="backLink" class="back-link">
      <i class="bi bi-arrow-left"></i> Back
    </a>

    <h1 class="page-title">Pickup</h1>

    <div class="action-card">
  <div class="equipment-name" id="checkin-device">—</div>

  <div class="detail-rows">
    <div class="detail-row">
      <div class="row-icon"><i class="bi bi-calendar3"></i></div>
      <div>
        <div class="row-label">Reservation Start</div>
        <div class="row-value" id="checkin-start">—</div>
      </div>
    </div>
    <div class="detail-row">
      <div class="row-icon"><i class="bi bi-calendar3"></i></div>
      <div>
        <div class="row-label">Reservation End</div>
        <div class="row-value" id="checkin-end">—</div>
      </div>
    </div>
    <div class="detail-row">
      <div class="row-icon"><i class="bi bi-geo-alt"></i></div>
      <div>
        <div class="row-label">Pickup Location</div>
        <div class="row-value" id="checkin-location">—</div>
      </div>
    </div>
  </div>

  <button class="btn-scan-qr" onclick="window.location.href='scanQrCode.html'">
    <i class="bi bi-qr-code-scan"></i> Scan QR Code
  </button>
</div>
  </div>

</div><!-- /page-wrapper -->

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../js/user/reservationAction_checkin.js"></script>
  <script>
  const logoutBtn = document.getElementById('logoutBtn');
  const token = localStorage.getItem('token');

  if (!token) window.location.href = '../../index.html';

  logoutBtn.addEventListener('click', (e) => {
    e.preventDefault();
    localStorage.removeItem('token');
    localStorage.removeItem('role');
    window.location.href = '../../index.html';
  });

  document.getElementById('navToggle').addEventListener('click', () => {
    document.getElementById('navLinks').classList.toggle('open');
  });
  </script>
</body>
</html>
