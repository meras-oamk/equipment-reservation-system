<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reservation Detail</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="../../css/navbar.css">
  <link rel="stylesheet" href="../../css/reservationDetails.css">
  <script src="../../js/user/navbar.js"></script>
</head>
<body>
<div class="page-wrapper">

  <!-- REUSEABLE NAVBAR -->
    <div id="static-container"></div>

  <!-- CONTENT -->
  <div class="content">
    <a href="myReservation.html" class="back-link">
      <i class="bi bi-arrow-left"></i> Back to reservations
    </a>

    <div class="detail-card">
      <!-- Status Banner -->
      <div class="status-banner">
  <div>
    <div class="category" id="detail-category">—</div>
    <div class="device-label" id="detail-device">—</div>
  </div>
  <span class="badge-inactive" id="detail-status-badge">Inactive</span>
</div>

      <div class="detail-body">

        <!-- Reservation Info -->
        <div class="section-title">Reservation Info</div>
        <div class="info-grid">
  <div class="info-item">
    <div class="info-label">Start Date &amp; Time</div>
    <div class="info-value" id="detail-start-time">— <span class="sub" id="detail-start-date"></span></div>
  </div>
  <div class="info-item">
    <div class="info-label">End Date &amp; Time</div>
    <div class="info-value" id="detail-end-time">— <span class="sub" id="detail-end-date"></span></div>
  </div>
  <div class="info-item">
    <div class="info-label">Duration</div>
    <div class="info-value" id="detail-duration">—</div>
  </div>
  <div class="info-item">
    <div class="info-label">Quantity</div>
    <div class="info-value" id="detail-quantity">1</div>
  </div>
  <div class="info-item">
    <div class="info-label">Pickup Location</div>
    <div class="info-value" id="detail-pickup-location">—</div>
  </div>
  <div class="info-item">
    <div class="info-label">Reservation ID</div>
    <div class="info-value" id="detail-reservation-id">—</div>
  </div>
</div>

        

        <!-- Actions -->
        <div class="section-title">Actions</div>
        <div class="detail-actions">
          <a href="myReservation.html" class="btn-back-res">
            <i class="bi bi-arrow-left"></i> Back to Reservations
          </a>

          <!-- Select your action split button -->
          <div class="action-split-btn" id="splitBtn">
            <span class="action-label" id="actionLabel">Select your action</span>
            <span class="action-chevron" id="actionChevron"><i class="bi bi-chevron-down"></i></span>
            <ul class="action-dropdown" id="actionDropdown">
              <li class="action-option" data-href="reservationAction_checkin.html">
                <i class="bi bi-box-arrow-in-down me-2"></i> Pickup
              </li>
              <li class="action-option" data-href="reservationAction_checkout.html">
                <i class="bi bi-box-arrow-up me-2"></i> Return
              </li>
            </ul>
          </div>
        </div>

      </div>
    </div>
  </div>

</div><!-- /page-wrapper -->

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../js/user/reservationDetails.js"></script>
  
  </body>
</html>
