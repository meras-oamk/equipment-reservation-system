<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Reservations</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="../../css/myReservation.css">
  </head>
<body>

  <!-- NAV -->
  <nav class="navbar navbar-expand-md sticky-top px-3 px-md-4">
    <a class="navbar-brand" href="equipments_list.html">
      <div class="logo-icon"><img src="../../Assets/Logo.png" alt="Logo" width="60" height="60"/></div>
    </a>

    <button class="navbar-toggler ms-auto" type="button"
      data-bs-toggle="collapse" data-bs-target="#navMenu"
      aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
      <i class="bi bi-list fs-4"></i>
    </button>

    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto gap-md-2 mt-2 mt-md-0">
        <li class="nav-item"><a class="nav-link" href="equipments_list.html">Equipments</a></li>
        <li class="nav-item"><a class="nav-link" href="myReservation.html">Reservations</a></li>
        <li class="nav-item"><a class="nav-link" href="myAccount.html">My Account</a></li>
        <li class="nav-item"><a class="nav-link logout" id="logoutBtn" href="index.html">Logout</a></li>
      </ul>
    </div>
  </nav>

  <!-- PAGE -->
  <div class="container py-4" style="max-width: 1100px;">
    <h1 class="page-title">My Reservations</h1>

    <div class="reservations-card">
      
      <!-- TABS -->
      <div class="tab-bar">
        <button class="tab-btn active" data-tab="inactive">Inactive</button>
        <button class="tab-btn" data-tab="active">Active</button>
        <button class="tab-btn" data-tab="overdue">Overdue</button>
        <button class="tab-btn" data-tab="completed">Completed</button>
      </div>


      <!-- DESKTOP TABLE -->
      <div class="desktop-table">
        <table class="res-table">
          <thead>
            <tr>
              <th>Device</th>
              <th>Reservation Id</th>
              <th>Pickup Date</th>
              <th>Return Date</th>
              <th>Duration</th>
              <th>Quantity</th>
              <th>Location</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>

      <!-- MOBILE LIST -->
      <div class="mobile-res-list" id="mobileList"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../js/user/myReservation.js" type="module"></script>
  <script>
  const logoutBtn = document.getElementById('logoutBtn');
  const token = localStorage.getItem('token');

  if (!token) window.location.href = '../../index.html';

  logoutBtn.addEventListener('click', (e) => {
    e.preventDefault(); // prevent the href from firing too
    localStorage.removeItem('token');
    localStorage.removeItem('role');
    window.location.href = '../../index.html';
  });
  </script>
  </body>
</html>
