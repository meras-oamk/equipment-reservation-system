<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Equipment Logs</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/css/admin_shared.css" />
  <link rel="stylesheet" href="/css/admin_logs_list.css" />
</head>
<body>

<!-- REUSEABLE NAVBAR -->
<div id="sidebar-container"></div>

<main class="main">
  <h4 class="fw-bold mb-4">Equipment Logs</h4>

  <!-- Stats -->
  <div class="row g-3 mb-4">
    <div class="col"><div class="stat-card"><div class="stat-label">Total Logs</div><div class="stat-value" id="statTotal">0</div></div></div>
    <div class="col"><div class="stat-card"><div class="stat-label">Status Updates</div><div class="stat-value" id="statStatusUpdates">0</div></div></div>
    <div class="col"><div class="stat-card"><div class="stat-label">Transfers</div><div class="stat-value" id="statTransfers">0</div></div></div>
  </div>

  <!-- Search + Filter -->
  <div class="d-flex gap-3 mb-4">
    <div class="position-relative flex-grow-1">
      <i class="bi bi-search position-absolute" style="left:14px;top:50%;transform:translateY(-50%);color:#aaa"></i>
      <input class="search-bar ps-5" id="searchInput" placeholder="Search by equipment, unit or user..." />
    </div>

    <div class="dropdown-wrap">
      <button class="filter-btn" id="actionFilterBtn"><i class="bi bi-funnel"></i> <span id="actionFilterLabel">All Actions</span></button>
      <div class="dropdown-menu-custom" id="actionFilterMenu">
        <div class="dropdown-item-custom active" data-action="all">All Actions</div>
        <div class="dropdown-item-custom" data-action="status_update">Status Update</div>
        <div class="dropdown-item-custom" data-action="transfer">Transfer</div>
      </div>
    </div>

    <div class="dropdown-wrap">
      <button class="filter-btn" id="dateFilterBtn"><i class="bi bi-calendar3"></i> <span id="dateFilterLabel">Date Range</span></button>
      <div class="dropdown-menu-custom dropdown-menu-date" id="dateFilterMenu">
        <label for="dateFrom">From</label>
        <input type="date" class="date-input" id="dateFrom" />
        <label for="dateTo">To</label>
        <input type="date" class="date-input" id="dateTo" />
        <div class="dropdown-actions">
          <button class="btn-clear" id="dateClearBtn">Clear</button>
          <button class="btn-apply" id="dateApplyBtn">Apply</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Table -->
  <div class="table-wrap">
    <div class="table-header">
      <span>Time</span>
      <span>Equipment</span>
      <span>User</span>
      <span>Action</span>
      <span>Status Change</span>
      <span>Condition Change</span>
      <span>Notes</span>
    </div>

    <div id="logsContainer">
      <div class="table-row" style="color:#aaa;">Loading...</div>
    </div>
  </div>
</main>
<script src="/js/admin/navbar.js"></script>
<script src="/js/admin/logs.js" defer></script>
</body>
</html>
