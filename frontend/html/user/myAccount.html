<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" href="/css/myAccount.css">
</head>
<body>

<div class="container py-4">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg custom-navbar mb-4">
        <div class="container-fluid">

            <a class="navbar-brand" href="#">
                <img src="/Assets/Logo.png" alt="Logo" height="45"> 
            </a>

            <button class="navbar-toggler border-0 shadow-none"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarMenu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarMenu">
                <ul class="navbar-nav ms-auto align-items-lg-center">
                    <li class="nav-item">
                        <a class="nav-link active" href="equipments_list.html">Equipments</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="myReservation.html">Reservations</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="myAccount.html">My Account</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link text-danger" href="/index.html" id="logoutBtn">Logout</a>
                    </li>
                </ul>
            </div>

        </div>
    </nav>

    <!-- Page Title -->
    <h2 class="section-title mb-4">
        My Account
    </h2>
    <div class="row align-items-start">

    <!-- Profile Card -->
    <div class="col-lg-5 col-md-6">
        <div class="profile-card">

            <h3 class="profile-title">Profile</h3>

            <div class="profile-item">
                <i class="bi bi-person"></i>
                <div>
                    <small>Full Name</small>
                    <p>Alexander Smith</p>
                </div>
            </div>

            <div class="profile-item">
                <i class="bi bi-envelope"></i>
                <div>
                    <small>Email</small>
                    <p>alexander.smith@example.com</p>
                </div>
            </div>

            <div class="profile-item">
                <i class="bi bi-shield-check"></i>
                <div>
                    <small>Role</small>
                    <p>Student</p>
                </div>
            </div>

        </div>
    </div>

    <!-- Forgot Password Button -->
    <div class="col-lg-7 col-md-6 d-flex justify-content-md-end justify-content-start mt-4 mt-md-0">
        <button
    class="forgot-password-btn"
    data-bs-toggle="modal"
    data-bs-target="#resetPasswordModal">

    <i class="bi bi-key"></i>
    Forgot Password
</button>
    </div>

</div>
<!-- Reset Password Modal -->
<div class="modal fade"
     id="resetPasswordModal"
     tabindex="-1"
     aria-hidden="true">

    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content reset-modal">

            <div class="modal-body p-4 p-md-5">

                <h2 class="reset-title">
                    Reset Password
                </h2>

                <form id="resetPasswordForm">

                    <div class="mb-3">
                        <label class="form-label reset-label">
                            New Password
                        </label>

                        <input
                            type="password"
                            class="form-control reset-input"
                            id="newPassword"
                            placeholder="newUser123">
                    </div>

                    <div class="mb-4">
                        <label class="form-label reset-label">
                            Confirm Password
                        </label>

                        <input
                            type="password"
                            class="form-control reset-input"
                            id="confirmPassword"
                            placeholder="newUser123">
                    </div>

                    <button
                        type="submit"
                        class="reset-btn">
                        Reset Password
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/user/myAccount.js" type="module"></script>
<script>
    const logoutBtn = document.getElementById('logoutBtn')
    const token = localStorage.getItem('token')
    
    if (!token) window.location.href = '/index.html'

    logoutBtn.addEventListener('click', () => {
        localStorage.removeItem('token');
        localStorage.removeItem('role');

        window.location.href = '/index.html'
    })
</script>
</body>
</html>
