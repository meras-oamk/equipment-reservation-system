<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Configuration</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/frontend/css/admin_shared.css" />
  <link rel="stylesheet" href="/frontend/css/admin_configuration.css" />
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-profile">
    <h6>Alexander Smith</h6>
    <small>alexander.smith@example.com</small>
  </div>
  <nav class="sidebar-nav">
    <a class="nav-item" href="#"><i class="bi bi-grid"></i> Dashboard</a>
    <a class="nav-item" href="./reservations_list.html"><i class="bi bi-calendar-check"></i> Reservations</a>
    <a class="nav-item" href="./equipments_list.html"><i class="bi bi-box-seam"></i> Equipments</a>
    <a class="nav-item active" href="./configuration.html"><i class="bi bi-gear"></i> Configuration</a>
    <a class="nav-item" href="./manageUsers.html"><i class="bi bi-people"></i> Manage Users</a>
    <a class="nav-item" href="#"><i class="bi bi-journal-text"></i> Logs</a>
    <a class="nav-item" href="#"><i class="bi bi-book"></i> Booking Policies</a>
  </nav>
  <div class="sidebar-footer">
    <a href="#" class="logout-btn"><i class="bi bi-box-arrow-right"></i> Log out</a>
  </div>
</aside>

<main class="main">
  <h4 class="fw-bold mb-4">Configuration</h4>

  <!-- Categories -->
  <div class="section-card">
    <div class="section-header">
      <div class="section-title">Equipment Categories</div>
      <button class="btn-add-cat"><i class="bi bi-plus-lg"></i> Add Category</button>
    </div>

    <div class="category-row">
      <span class="cat-name">VR/AR</span>
      <div class="text-center">
        <div class="cat-count">8</div>
        <div class="cat-count-label">Equipments</div>
      </div>
      <button class="btn-delete-cat"><i class="bi bi-trash"></i></button>
    </div>

    <div class="category-row">
      <span class="cat-name">IoT and Embedded</span>
      <div class="text-center">
        <div class="cat-count">3</div>
        <div class="cat-count-label">Equipments</div>
      </div>
      <button class="btn-delete-cat"><i class="bi bi-trash"></i></button>
    </div>

    <div class="category-row">
      <span class="cat-name">Robotics</span>
      <div class="text-center">
        <div class="cat-count">5</div>
        <div class="cat-count-label">Equipments</div>
      </div>
      <button class="btn-delete-cat"><i class="bi bi-trash"></i></button>
    </div>
  </div>

  <!-- Reservation Rules -->
  <div class="section-card">
    <div class="rules-title">Reservation Rules</div>

    <div class="row g-3 mb-3">
      <div class="col-12 rule-field">
        <label>Apply for Category:</label>
        <select class="rule-select">
          <option>IoT and Embedded</option>
          <option>VR/AR</option>
          <option>Robotics</option>
          <option>Audio/Video</option>
          <option>Laboratory</option>
          <option>Computing</option>
        </select>
      </div>
    </div>

    <div class="row g-3">
      <div class="col-md-6 rule-field">
        <label>Max Reservation Duration (days)</label>
        <input class="rule-input" type="number" placeholder="3" />
      </div>
      <div class="col-md-6 rule-field">
        <label>Max Active Reservations (per user)</label>
        <input class="rule-input" type="number" placeholder="3" />
      </div>
      <div class="col-md-6 rule-field">
        <label>Buffer Time Between Bookings (hours)</label>
        <input class="rule-input" type="number" placeholder="0.5" step="0.5" />
      </div>
      <div class="col-md-6 rule-field">
        <label>Advance Booking Window (days)</label>
        <input class="rule-input" type="number" placeholder="30" />
      </div>
    </div>

    <button class="btn-save mt-3">Save Rules</button>
  </div>
</main>

</body>
</html>
