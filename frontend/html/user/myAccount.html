<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../../css/navbar.css">
    <link rel="stylesheet" href="/css/myAccount.css">
</head>
<body>
<div class="page-wrapper">

    <!-- REUSEABLE NAVBAR -->
    <div id="static-container"></div> 

    <div class="content">
        <h1 class="page-title">My Account</h1>


        <div class="account-card">

            <!-- Profile -->
            <div class="account-section">
                <h3 class="section-label">Profile</h3>
                <div class="profile-row">
                    <i class="bi bi-person"></i>
                    <div><small>Full Name</small><p id="profileName">Loading...</p></div>
                </div>
                <div class="profile-row">
                    <i class="bi bi-envelope"></i>
                    <div><small>Email</small><p id="profileEmail">Loading...</p></div>
                </div>
                <div class="profile-row">
                    <i class="bi bi-shield-check"></i>
                    <div><small>Role</small><p id="profileRole">Loading...</p></div>
                </div>
            </div>

            <hr class="account-divider">

            <!-- Security -->
            <div class="account-section">
                <h3 class="section-label">Security</h3>
                <button class="btn-account" data-bs-toggle="modal" data-bs-target="#resetPasswordModal">
                    <i class="bi bi-key"></i> Change Password
                </button>
            </div>

            <hr class="account-divider">

            <!-- Policy -->
            <div class="account-section">
                <h3 class="section-label">Policies</h3>
                <p class="policy-text">Review the equipment reservation policies before making a booking.</p>
                <a href="../documents/policy.pdf" target="_blank" class="btn-account btn-account-outline">
                    <i class="bi bi-file-earmark-pdf"></i> View Reservation Policy
                </a>
            </div>

        </div>
    </div>

</div><!-- /page-wrapper -->

<!-- Reset Password Modal -->
<div class="modal fade" id="resetPasswordModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content reset-modal">
            <div class="modal-body p-4 p-md-5">
                <h2 class="reset-title">Reset Password</h2>
                <form id="resetPasswordForm">
                    <div class="mb-3">
                        <label class="form-label reset-label">New Password</label>
                        <input type="password" class="form-control reset-input" id="newPassword" placeholder="newUser123">
                    </div>
                    <div class="mb-4">
                        <label class="form-label reset-label">Confirm Password</label>
                        <input type="password" class="form-control reset-input" id="confirmPassword" placeholder="newUser123">
                    </div>
                    <button type="submit" class="reset-btn">Reset Password</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../js/user/navbar.js"></script>
<script src="/js/user/myAccount.js" type="module"></script>
</body>
</html>
