<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Scanning QR Code</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="../../css/scanQrCode.css">
  </head>
<body>
<div class="page-wrapper">

  <!-- NAVBAR -->
  <nav class="top-navbar">
    <img src="../../Assets/Logo.png" alt="Logo" class="logo">
    <button class="nav-toggle" id="navToggle"><i class="bi bi-list"></i></button>
    <div class="nav-links" id="navLinks">
      <a href="equipments_list.html">Equipments</a>
      <a href="myReservation.html" class="active">Reservations</a>
      <a href="myAccount.html">My Account</a>
      <a href="#" class="logout" id="logoutBtn">Logout</a>
    </div>
  </nav>

  <!-- CONTENT -->
  <div class="content">
    <h1 class="page-title">Scanning QR Code</h1>

    <div class="scan-card">
      <div class="scan-card-title">Scan QR Code</div>

      <!-- QR Viewfinder -->
      <div id="reader" style="width:100%;"></div>

      <p class="qr-hint">Position the QR code within the frame</p>

      <!-- OR divider -->
      <div class="or-divider">OR</div>

      <!-- Close -->
      <button class="btn-close-page" onclick="history.back()">Close</button>
    </div>
  </div>

</div><!-- /page-wrapper -->

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8"></script>
  <script src="../../js/user/scanQrCode.js"></script>
  <script>
  const logoutBtn = document.getElementById('logoutBtn');
  const token = localStorage.getItem('token');

  if (!token) window.location.href = '../../index.html';

  logoutBtn.addEventListener('click', (e) => {
    e.preventDefault();
    localStorage.removeItem('token');
    localStorage.removeItem('role');
    window.location.href = '../../index.html';
  });

  document.getElementById('navToggle').addEventListener('click', () => {
    document.getElementById('navLinks').classList.toggle('open');
  });
  </script>
</body>
</html>
