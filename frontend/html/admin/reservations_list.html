<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reservations</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/css/admin_shared.css" />
  <link rel="stylesheet" href="/css/admin_reservations_list.css" />
</head>
<body>

<!-- REUSEABLE NAVBAR -->
<div id="sidebar-container"></div>

<main class="main">
  <h4 class="fw-bold mb-4">Reservations</h4>

  <!-- Stats -->
  <div class="row g-3 mb-4">
    <div class="col"><div class="stat-card"><div class="stat-label">Total</div><div class="stat-value">9</div></div></div>
    <div class="col"><div class="stat-card"><div class="stat-label">Reserved</div><div class="stat-value">1</div></div></div>
    <div class="col"><div class="stat-card"><div class="stat-label">Active</div><div class="stat-value">5</div></div></div>
    <div class="col"><div class="stat-card"><div class="stat-label">Return Request</div><div class="stat-value">2</div></div></div>
    <div class="col"><div class="stat-card"><div class="stat-label">Overdue</div><div class="stat-value">1</div></div></div>
  </div>

  <!-- Search + Filter -->
  <div class="d-flex gap-3 mb-4">
    <div class="position-relative flex-grow-1">
      <i class="bi bi-search position-absolute" style="left:14px;top:50%;transform:translateY(-50%);color:#aaa"></i>
      <input class="search-bar ps-5" placeholder="Search by name or category..." />
    </div>
    <button class="filter-btn"><i class="bi bi-funnel"></i> All Equipments</button>
  </div>

  <!-- Table -->
  <div class="table-wrap">
    <div class="table-header">
      <span>Reservation ID</span>
      <span>Equipment</span>
      <span>User</span>
      <span>Start date</span>
      <span>End Date</span>
      <span>Status</span>
    </div>

  </div>
</main>

<script src="/js/admin/navbar.js"></script>
<script src="/js/admin/reservations_list.js"></script>

</body>
</html>
