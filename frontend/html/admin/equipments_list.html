<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Equipment Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/css/admin_shared.css" />
  <link rel="stylesheet" href="/css/admin_equipments_list.css" />
</head>
<body>

<!-- REUSEABLE NAVBAR -->
<div id="sidebar-container"></div>

<main class="main">
  <div class="page-header">
    <h4 class="fw-bold mb-0">Equipment Management</h4>
    <button class="btn-add" onclick="openTypeModal()"><i class="bi bi-plus-lg"></i> Add Equipment</button>
  </div>

  <!-- Search + Filter -->
  <div class="d-flex gap-3 mb-4">
    <div class="position-relative flex-grow-1">
      <i class="bi bi-search position-absolute" style="left:14px;top:50%;transform:translateY(-50%);color:#aaa"></i>
      <input id="searchInput" class="search-bar ps-5" placeholder="Search by name or category..." />
    </div>
    <select class="filter-btn" id="categoryFilter">
      <option value="">All Equipments</option>
      <option value="vr_ar">VR/AR</option>
      <option value="robotics">Robotics</option>
      <option value="audio_video">Audio/Video</option>
      <option value="laboratory">Laboratory</option>
      <option value="computing">Computing</option>
      <option value="iot_embedded">IoT/Embedded</option>
    </select>
    <select class="filter-btn" id="subcategoryFilter">
      <option value="">All Subcategories</option>
    </select>
  </div>

  <!-- Equipment Cards -->
  <div id="equipmentList"></div>
</main>

<!-- ===================== -->
<!-- MODAL 1: ADD/EDIT TYPE -->
<!-- ===================== -->
<div class="modal-overlay" id="typeModal">
  <div class="modal-box">
    <div class="modal-title">
      <button class="modal-back" onclick="closeTypeModal()"><i class="bi bi-chevron-left"></i></button>
      <span id="typeModalTitle">Add Equipment</span>
    </div>

    <input type="hidden" id="typeId" />

    <div class="modal-field">
      <label>Equipment Name<span class="req">*</span></label>
      <input class="modal-input" id="typeName" type="text" placeholder="" />
    </div>

    <div class="modal-field">
      <label>Category<span class="req">*</span></label>
      <select class="modal-select" id="typeCategory" onchange="updateSubcategory()">
        <option value="">Select category</option>
        <option value="vr_ar">VR/AR</option>
        <option value="robotics">Robotics</option>
        <option value="audio_video">Audio/Video</option>
        <option value="laboratory">Laboratory</option>
        <option value="computing">Computing</option>
        <option value="iot_embedded">IoT/Embedded</option>
      </select>
    </div>

    <div class="modal-field">
      <label>Sub category<span class="req">*</span></label>
      <select class="modal-select" id="typeSubcategory">
        <option value="">Select category first</option>
      </select>
    </div>

    <div class="modal-field">
      <label>Description</label>
      <textarea class="modal-textarea" id="typeDescription" placeholder=""></textarea>
    </div>

    <div class="modal-field">
      <label>Image</label>
      <div class="modal-upload" onclick="document.getElementById('typeImage').click()">
        <i class="bi bi-cloud-upload"></i> Upload image
      </div>
      <input type="file" id="typeImage" accept="image/jpeg,image/png,image/webp,image/gif" style="display:none" onchange="previewImage(this)" />
      <img id="typeImagePreview" src="" alt="" style="display:none;width:100%;margin-top:8px;border-radius:8px;max-height:150px;object-fit:contain;" />
    </div>

    <div class="modal-footer">
      <button class="btn-modal-cancel" onclick="closeTypeModal()">Cancel</button>
      <button class="btn-modal-save" onclick="saveType()">Save</button>
    </div>
  </div>
</div>

<!-- ===================== -->
<!-- MODAL 2: ADD/EDIT UNIT -->
<!-- ===================== -->
<div class="modal-overlay" id="unitModal">
  <div class="modal-box">
    <div class="modal-title">
      <button class="modal-back" onclick="closeUnitModal()"><i class="bi bi-chevron-left"></i></button>
      <span id="unitModalTitle">Add Unit</span>
    </div>

    <input type="hidden" id="unitId" />
    <input type="hidden" id="unitTypeId" />

    <!-- FORM SECTION -->
    <div id="unitFormSection">
      <div class="modal-field">
        <label>Serial Number<span class="req">*</span></label>
        <input class="modal-input" id="unitQrCode" type="text" placeholder="" />
      </div>

      <div class="modal-field">
        <label>Location<span class="req">*</span></label>
        <select class="modal-select" id="unitLocation">
          <option value="">Select location</option>
          <option>Kontinkangas 5a</option>
          <option>Kontinkangas SOTE</option>
          <option>Linnanmaa Keskusaula</option>
          <option>Linnanmaa Kirjasto</option>
          <option>Linnanmaa OAMK</option>
        </select>
      </div>

      <div class="modal-field">
        <label>Condition<span class="req">*</span></label>
        <select class="modal-select" id="unitCondition" onchange="syncStatusWithCondition()">
          <option value="good">Good</option>
          <option value="scratched">Scratched</option>
          <option value="missing_parts">Missing Parts</option>
          <option value="malfunction">Malfunction</option>
          <option value="damaged">Damaged</option>
        </select>
      </div>

      <div class="modal-field">
        <label>Status<span class="req">*</span></label>
        <select class="modal-select" id="unitStatus">
          <option value="available">Available</option>
          <option value="maintenance">Maintenance</option>
          <option value="broken">Broken</option>
          <option value="lost">Lost</option>
        </select>
      </div>

      <div class="modal-footer">
        <button class="btn-modal-cancel" onclick="closeUnitModal()">Cancel</button>
        <button class="btn-modal-save" id="unitSaveBtn" onclick="saveUnit()">Save</button>
      </div>
    </div>

    <!-- QR SUCCESS SECTION (shown after new unit saved) -->
    <div id="qrSuccessSection" style="display:none; text-align:center; padding:8px 0 4px;">
      <div style="color:#16a34a;font-size:14px;font-weight:600;margin-bottom:12px;">
        <i class="bi bi-check-circle-fill"></i> Unit saved!
      </div>
      <img id="qrSuccessImg" src="" alt="QR Code"
           style="width:180px;height:180px;border:1px solid #eee;border-radius:8px;object-fit:contain;" />
      <div id="qrSuccessCode"
           style="font-size:13px;font-weight:600;margin:10px 0 2px;word-break:break-all;"></div>
      <div style="font-size:11px;color:#888;margin-bottom:14px;">Scan to identify this unit</div>
      <input type="hidden" id="qrPrintUnitId" />
      <div class="modal-footer" style="justify-content:center;gap:10px;">
        <button class="btn-modal-cancel" onclick="triggerPrintQR()">
          <i class="bi bi-printer"></i> Print QR
        </button>
        <button class="btn-modal-save" onclick="finishAddUnit()">Done</button>
      </div>
    </div>
  </div>
</div>
<!-- ===================== -->
<!-- MODAL 3: VIEW DETAILS -->
<!-- ===================== -->
<div class="modal-overlay" id="detailModal">
  <div class="modal-box" style="width:560px;padding:0;overflow:hidden;">
    
    <!-- Header image -->
    <div style="position:relative;">
      <img id="detailImage" src="" alt="" style="width:100%;height:180px;object-fit:contain;display:block;background:#f8f9fa;" />
      <button onclick="closeDetailModal()" style="position:absolute;top:12px;right:12px;background:rgba(0,0,0,0.5);border:none;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;font-size:16px;">
        <i class="bi bi-x"></i>
      </button>
    </div>

    <!-- Info -->
    <div style="padding:20px 24px;">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:8px;">
        <div>
          <div class="name" id="detailName" style="font-size:18px;font-weight:700;margin-bottom:4px;"></div>
          <div class="meta" id="detailMeta"></div>
        </div>
        <div style="text-align:right;">
          <div style="font-size:11px;color:#888;margin-bottom:2px;">Available Units</div>
          <div id="detailCount" style="font-size:22px;font-weight:700;color:var(--orange);"></div>
        </div>
      </div>

      <p id="detailDescription" style="font-size:13px;color:#666;line-height:1.6;margin-bottom:16px;white-space:pre-wrap;"></p>

      <!-- Units table -->
      <div style="border-top:1px solid #eee;padding-top:14px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
          <span style="font-size:13px;font-weight:700;">Individual Units</span>
          <span id="detailTotalUnits" style="font-size:12px;color:#888;"></span>
        </div>
        <div class="units-header">
          <span>Serial No.</span><span>Status</span><span>Condition</span><span>Location</span>
        </div>
        <div id="detailUnits"></div>
      </div>

      <div style="display:flex;justify-content:flex-end;margin-top:16px;">
        <button class="btn-modal-cancel" onclick="closeDetailModal()">Close</button>
      </div>
    </div>
  </div>
</div>

<script>
  document.getElementById('typeModal').addEventListener('click', function(e) {
    if (e.target === this) closeTypeModal();
  });
  document.getElementById('unitModal').addEventListener('click', function(e) {
    if (e.target === this) closeUnitModal();
  });

  const subcategories = {
    vr_ar: ['AR Glasses', 'Base Stations / Sensors', 'Haptic Gloves', 'Motion Trackers', 'VR Controllers', 'VR Headset', 'VR Ready Laptops'],
    robotics: ['Drones', 'Educational Robots', 'Embedded Boards', 'Mobile Robots', 'Motor Controllers', 'Robot Arms', 'Sensors'],
    audio_video: ['Cameras', 'Capture Cards', 'Lighting Kits', 'Microphones', 'Tripods', 'Video Switches'],
    laboratory: ['3D Printers', 'Microscopes', 'Multimeters', 'Oscilloscopes', 'Power Supplies', 'Signal Generators'],
    computing: ['GPUs', 'Laptops', 'Networking Equipment', 'Raspberry Pi Kits', 'Tablets', 'Workstations'],
    iot_embedded: ['FPGA Boards', 'LoRa Devices', 'Microcontrollers', 'Sensor Modules', 'Smart Home Kits']
  }

  function updateSubcategory() {
    const category = document.getElementById('typeCategory').value
    const select = document.getElementById('typeSubcategory')
    select.innerHTML = '<option value="">Select subcategory</option>'
    if (category && subcategories[category]) {
      subcategories[category].forEach(sub => {
        const opt = document.createElement('option')
        opt.value = sub
        opt.textContent = sub
        select.appendChild(opt)
      })
    }
  }

</script>
<script src="/js/admin/navbar.js"></script>
<script src="/js/admin/equipments_list.js"></script>

</body>
</html>
